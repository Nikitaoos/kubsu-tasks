name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  APP_DIR: docker
  IMAGE: kubsu-users

jobs:
  # 1. Тесты: собираем образ и гоняем pytest внутри него рядом с Postgres
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kubsu
          POSTGRES_PASSWORD: kubsu
          POSTGRES_DB: kubsu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kubsu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t $IMAGE:test $APP_DIR

      - name: Run tests inside the built image
        run: >
          docker run --rm --network host
          -e DATABASE_URL=postgresql+psycopg://kubsu:kubsu@127.0.0.1:5432/kubsu
          $IMAGE:test

  # 2. Сборка итогового образа и упаковка в архив (на сервере нет интернета)
  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime image
        run: |
          docker build --target runtime -t $IMAGE:latest $APP_DIR
          docker image ls $IMAGE
          docker save $IMAGE:latest | gzip > image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  # 3. Деплой через self-hosted runner: сервер недоступен из сетей GitHub,
  #    поэтому этот job выполняется на машине, откуда сервер виден.
  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Copy image and deploy script to server
        shell: powershell
        run: |
          $key = "$env:USERPROFILE\.ssh\kubsu_deploy"
          scp -o BatchMode=yes -i $key -P "${{ secrets.SSH_PORT }}" image.tar.gz "$env:APP_DIR/deploy.sh" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Deploy
        shell: powershell
        run: |
          $key = "$env:USERPROFILE\.ssh\kubsu_deploy"
          ssh -o BatchMode=yes -i $key -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "APP_PORT=${{ secrets.APP_PORT }} PATH_PREFIX=/${{ secrets.SSH_USER }} sh /tmp/deploy.sh"
          if ($LASTEXITCODE -ne 0) { exit 1 }
